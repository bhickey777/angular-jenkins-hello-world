services:

  hello-world:
    image: hello-world:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: hello-world
    restart: unless-stopped
    build:
      context: ./hello-world
      dockerfile: Dockerfile
    ports:
      - "4200:8080"

  hello-world-svc:
    image: hello-world-svc:${IMAGE_TAG}
    container_name: hello-world-svc
    restart: unless-stopped
    build:
      context: ./hello-world-svc
      dockerfile: Dockerfile
    ports:
      - "8090:8090"

  hello-world-holdings:
    image: hello-world-holdings:${IMAGE_TAG}
    container_name: hello-world-holdings
    restart: unless-stopped
    build:
      context: ./hello-world-holdings
      dockerfile: Dockerfile
    ports:
      - "6200:6200"
    
  hello-world-rpt:
    image: hello-world-rpt:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: hello-world-rpt
    restart: unless-stopped
    build:
      context: ./hello-world-rpt
      dockerfile: Dockerfile
    ports:
      - "5200:8080"

  hello-world-auth:
    image: hello-world-auth:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: hello-world-auth
    restart: unless-stopped
    build:
      context: ./hello-world-auth
      dockerfile: Dockerfile
    ports:
      - "3000:3000"

  market-service:
    build:
      context: ./stock-quotes
    ports:
      - "8000:8000"
    environment:
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      
  postgres:
    image: postgres:18
    container_name: enterprise-postgres
    environment:
      POSTGRES_HOST: "${DB_HOST}"
      POSTGRES_DB: "${DB_NAME}"
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enterprise"]
      interval: 2s
      timeout: 5s
      retries: 15
