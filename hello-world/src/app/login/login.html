<div class="login-page">
  <div class="login-card">

    <h1>Login</h1>
    <p>Sign in to your account</p>

    <form
      [formGroup]="loginForm"
      (ngSubmit)="submit()">

      <div class="form-group">
        <label for="username">
          Username
        </label>

        <input
          id="username"
          type="text"
          formControlName="username"
          placeholder="Enter your username">
      </div>

      <div class="form-group">
        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Enter your password">
      </div>

      <button
        type="submit"
        [disabled]="loginForm.invalid">
        Login
      </button>

    </form>

    @if (error()) {
      <p class="error">
        {{ error() }}
      </p>
    }

  </div>
</div>
