<div class="reporting-home">

  <main class="home-content">

    <!-- Top row -->
    <aside class="employee-area">
      <app-employee-info></app-employee-info>
    </aside>

    <section class="customer-area">
      <app-customer-lookup></app-customer-lookup>
    </section>

    <aside class="reports-area">
      <app-report-list
        (reportSelected)="selectedReport = $event">
      </app-report-list>
    </aside>

    <!-- Bottom row -->
    <section class="report-viewer-area">
      <app-report-viewer
        [reportType]="selectedReport">
      </app-report-viewer>
    </section>

  </main>

</div>
